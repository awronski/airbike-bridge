[platformio]
core_dir = .pio-core
default_envs = atom-lite

[env:atom-lite]
platform = espressif32@6.12.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.5.2
extra_scripts = pre:scripts/embed_web.py
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
